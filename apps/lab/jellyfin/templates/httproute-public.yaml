# Public route for streaming away from home. Jellyfin's own logins protect it;
# the LAN/VPN route comes from the chart's httpRoute values.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-public
  namespace: jellyfin
  annotations:
    link.argocd.argoproj.io/external-link: https://jellyfin.ciliber.to
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab-gateway
      namespace: gateway
      sectionName: https-public
  hostnames:
    - jellyfin.ciliber.to
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: jellyfin
          port: 8096
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
