# Radarr matches Blu-ray rips to movies and moves them into the Jellyfin
# library as "Movies/Title (Year)/Title (Year).mkv". There is no download
# client: rips are copied into Import/ on the library share and brought in
# with Wanted > Manual Import. Import/ and Movies/ live on the same NFS
# share, so a move is a rename, not a copy of a 50 GB file.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: radarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: radarr
spec:
  replicas: 1
  # The config volume is ReadWriteOnce, so stop the old pod before starting a new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radarr
          # https://github.com/home-operations/containers/tree/main/apps/radarr
          image: ghcr.io/home-operations/radarr:7.0.0
          env:
            # Require a login for every request. Traffic arrives through the
            # gateway from inside the cluster, so "disabled for local
            # addresses" would leave it open. The user is created on first visit.
            - name: RADARR__AUTH__METHOD
              value: Forms
            - name: RADARR__AUTH__REQUIRED
              value: Enabled
          ports:
            - name: http
              containerPort: 7878
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # SQLite database and settings. Backed up by the Longhorn recurring jobs.
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        # The Jellyfin library share on orca (Movies/, TV/, Import/), read-write.
        - name: library
          nfs:
            server: orca.ciliber.to
            path: /volume1/library
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: radarr
spec:
  selector:
    app.kubernetes.io/name: radarr
  ports:
    - name: http
      port: 7878
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: radarr
  annotations:
    link.argocd.argoproj.io/external-link: https://radarr.lab.ciliber.to
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab-gateway
      namespace: gateway
      sectionName: https-lab
  hostnames:
    - radarr.lab.ciliber.to
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: radarr
          port: 7878
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
