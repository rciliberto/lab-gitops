apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
  namespace: bazarr
  annotations:
    link.argocd.argoproj.io/external-link: https://bazarr.lab.ciliber.to
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab-gateway
      namespace: gateway
      sectionName: https-lab
  hostnames:
    - bazarr.lab.ciliber.to
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: bazarr
          port: 6767
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
