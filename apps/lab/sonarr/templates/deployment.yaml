# Sonarr matches ripped TV episodes to shows and moves them into the
# Jellyfin library as "TV/Show (Year)/Season 01/...". Like Radarr, there is
# no download client: copy rips into Import/ on the library share and bring
# them in with Wanted > Manual Import (Move). Root folder: /data/TV.
# On first visit it asks you to create a login. Pick Forms and set
# "Authentication Required" to Enabled: traffic arrives through the gateway
# from inside the cluster, so "disabled for local addresses" would leave it open.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: sonarr
spec:
  replicas: 1
  # The config volume is ReadWriteOnce, so stop the old pod before starting a new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sonarr
          # https://github.com/home-operations/containers/tree/main/apps/sonarr
          image: ghcr.io/home-operations/sonarr:5.0.0.2907
          ports:
            - name: http
              containerPort: 8989
          readinessProbe:
            httpGet:
              path: /ping
              port: http
              # The kubelet sends the pod IP as Host, which the app's
              # "Allowed Hosts" setting rejects. localhost is always allowed.
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
              # The kubelet sends the pod IP as Host, which the app's
              # "Allowed Hosts" setting rejects. localhost is always allowed.
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # SQLite database and settings. Backed up by the Longhorn recurring jobs.
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        # The Jellyfin library share on orca (Movies/, TV/, Import/), read-write.
        - name: library
          nfs:
            server: orca.ciliber.to
            path: /volume1/library
        - name: tmp
          emptyDir: {}
