# Sonarr matches ripped TV episodes to shows and moves them into the
# Jellyfin library as "TV/Show (Year)/Season 01/...". Like Radarr, there is
# no download client: copy rips into Import/ on the library share and bring
# them in with Wanted > Manual Import (Move). Root folder: /data/TV.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: sonarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: sonarr
spec:
  replicas: 1
  # The config volume is ReadWriteOnce, so stop the old pod before starting a new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sonarr
          # https://github.com/home-operations/containers/tree/main/apps/sonarr
          image: ghcr.io/home-operations/sonarr:5.0.0.2907
          env:
            # Require a login for every request. Traffic arrives through the
            # gateway from inside the cluster, so "disabled for local
            # addresses" would leave it open. The user is created on first visit.
            - name: SONARR__AUTH__METHOD
              value: Forms
            - name: SONARR__AUTH__REQUIRED
              value: Enabled
          ports:
            - name: http
              containerPort: 8989
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # SQLite database and settings. Backed up by the Longhorn recurring jobs.
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        # The Jellyfin library share on orca (Movies/, TV/, Import/), read-write.
        - name: library
          nfs:
            server: orca.ciliber.to
            path: /volume1/library
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: sonarr
spec:
  selector:
    app.kubernetes.io/name: sonarr
  ports:
    - name: http
      port: 8989
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: sonarr
  annotations:
    link.argocd.argoproj.io/external-link: https://sonarr.lab.ciliber.to
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab-gateway
      namespace: gateway
      sectionName: https-lab
  hostnames:
    - sonarr.lab.ciliber.to
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: sonarr
          port: 8989
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
