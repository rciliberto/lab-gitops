apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01-issuer
    # Keep DNS on the Envoy gateway while both run side by side. Remove at the cutover.
    external-dns.alpha.kubernetes.io/target: 10.30.0.2
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      # Test address while Envoy Gateway still holds 10.30.0.2. Moves to 10.30.0.2 at the cutover.
      lbipam.cilium.io/ips: 10.30.0.3
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https-lab
      hostname: "*.lab.ciliber.to"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: lab-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-public
      hostname: "*.ciliber.to"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: public-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-launchboats-dev
      hostname: "*.launchboats.dev"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: launchboats-dev-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-launch-boats
      hostname: "*.launch.boats"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: launch-boats-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-dslstats
      hostname: "dslstats.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: dslstats-com-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: ssh
      port: 22
      protocol: TCP
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
    - name: ssh-alt
      port: 2222
      protocol: TCP
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
