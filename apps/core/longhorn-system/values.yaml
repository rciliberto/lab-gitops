longhorn:
  preUpgradeChecker:
    jobEnabled: false
  defaultSettings:
    defaultDataPath: /var/lib/longhorn
    defaultReplicaCount: 3
    guaranteedInstanceManagerCPU: 0
    storageOverProvisioningPercentage: 200
    # Upgrade volume engines automatically after a Longhorn upgrade, one volume per node at a time.
    concurrentAutomaticEngineUpgradePerNodeLimit: 1
  persistence:
    defaultClass: true
    defaultClassReplicaCount: 3
  defaultBackupStore:
    backupTarget: nfs://orca.ciliber.to:/volume1/kubernetes-backup/longhorn
