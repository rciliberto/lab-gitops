longhorn:
  preUpgradeChecker:
    jobEnabled: false
  defaultSettings:
    defaultDataPath: /var/lib/longhorn
    defaultReplicaCount: 3
    guaranteedInstanceManagerCPU: 0
    storageOverProvisioningPercentage: 200
  persistence:
    defaultClass: true
    defaultClassReplicaCount: 3
  defaultBackupStore:
    backupTarget: nfs://orca.ciliber.to:/volume2/kubernetes-backup/longhorn
