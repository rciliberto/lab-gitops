# Hubble UI is read-only and *.lab.ciliber.to only resolves on the home network
# or VPN, so it has no auth in front, same as the Longhorn UI.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: cilium
  annotations:
    link.argocd.argoproj.io/external-link: https://hubble.lab.ciliber.to
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab-gateway
      namespace: envoy-gateway-system
      sectionName: https-lab
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab-gateway
      namespace: gateway
      sectionName: https-lab
  hostnames:
    - hubble.lab.ciliber.to
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: hubble-ui
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
