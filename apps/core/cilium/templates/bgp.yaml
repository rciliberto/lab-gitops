# Announces LoadBalancer IPs to the UniFi UDM Pro over BGP (replaces MetalLB).
# Router side: docs/unifi-metallb-bgp.conf (same ASNs, neighbors and prefixes).
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  blocks:
    - start: 10.30.0.2
      stop: 10.30.0.255
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: router
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  bgpInstances:
    - name: lab
      localASN: 64500
      peers:
        - name: udm-pro
          peerASN: 64501
          peerAddress: 10.20.20.1
          peerConfigRef:
            name: router
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: router
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: loadbalancer-ips
---
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: loadbalancer-ips
  labels:
    advertise: loadbalancer-ips
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      # Match every Service.
      selector:
        matchExpressions:
          - key: io.cilium/bgp-skip
            operator: DoesNotExist
