apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dsl-dashboard-db
  namespace: dsl-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  # With one instance the PDB can never be satisfied, so it only blocks node drains.
  enablePDB: false
  storage:
    storageClass: longhorn
    size: 10Gi
  bootstrap:
    initdb:
      database: dsl_dashboard
      owner: dsl_dashboard
