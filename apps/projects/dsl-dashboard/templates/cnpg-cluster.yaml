apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dsl-dashboard-db
  namespace: dsl-dashboard
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: dsl-dashboard-db-backup
  storage:
    storageClass: longhorn
    size: 10Gi
  bootstrap:
    initdb:
      database: dsl_dashboard
      owner: dsl_dashboard
