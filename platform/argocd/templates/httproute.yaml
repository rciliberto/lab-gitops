apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    link.argocd.argoproj.io/external-link: https://argocd.lab.ciliber.to
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: lab-gateway
      namespace: gateway
      sectionName: https-lab
  hostnames:
    - argocd.lab.ciliber.to
  rules:
    # The gateway rewrites gRPC-web to gRPC, so the CLI's requests can arrive here
    # with either content type. Both need the h2c port, and the web UI can't use it.
    - backendRefs:
        - group: ''
          kind: Service
          name: platform-argocd-server
          port: 8080
          weight: 1
      matches:
        - headers:
            - name: content-type
              value: application/grpc-web+proto
        - headers:
            - name: content-type
              value: application/grpc
    - backendRefs:
        - group: ''
          kind: Service
          name: platform-argocd-server
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /