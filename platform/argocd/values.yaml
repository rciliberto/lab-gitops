argo-cd:
  global:
    domain: argocd.lab.ciliber.to
  createClusterRoles: true
  crds:
    install: true
  redis-ha:
    enabled: true
    haproxy:
      # Required anti-affinity puts one haproxy on each of the 3 workers, so a
      # surge pod can never schedule. Replace pods one at a time instead.
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
  server:
    extraArgs:
      - --insecure
    # No metrics-server in the cluster, so an HPA can't read CPU and leaves
    # the app Degraded. Run a fixed 2 replicas instead.
    replicas: 2
  repoServer:
    initContainers:
      - name: install-helm4
        image: alpine:3
        command: [sh, -c]
        args:
          - wget -qO- https://get.helm.sh/helm-v4.1.3-linux-amd64.tar.gz | tar xz -C /custom-tools linux-amd64/helm --strip-components=1
        volumeMounts:
          - name: custom-tools
            mountPath: /custom-tools
    volumes:
      - name: custom-tools
        emptyDir: {}
    volumeMounts:
      - name: custom-tools
        mountPath: /usr/local/bin/helm
        subPath: helm
    # No metrics-server in the cluster, so an HPA can't read CPU and leaves
    # the app Degraded. Run a fixed 2 replicas instead.
    replicas: 2
  applicationSet:
    replicas: 2