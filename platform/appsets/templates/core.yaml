apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git@github.com:rciliberto/lab-gitops.git
        revision: main
        directories:
          - path: apps/core/*
  template:
    metadata:
      name: '{{ `{{ .path.basename }}` }}'
    spec:
      project: core
      source:
        repoURL: git@github.com:rciliberto/lab-gitops.git
        path: '{{ `{{ .path.path }}` }}'
        targetRevision: main
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ `{{ .path.basename }}` }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
  # Envoy Gateway's chart also ships the Gateway API CRDs, which apps/core/gateway-api owns now.
  # Stop rendering them here, and don't prune, so Argo CD doesn't delete the CRDs (and every
  # Gateway and route with them) when they leave this app. Envoy Gateway is gone; remove this in a
  # follow-up once Argo CD has deleted the envoy-gateway-system app.
  templatePatch: |
    {{ `{{- if eq .path.basename "envoy-gateway-system" }}` }}
    spec:
      source:
        helm:
          skipCrds: true
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
    {{ `{{- end }}` }}
